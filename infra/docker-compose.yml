# HISIEM SOC Copilot — local development infrastructure

# PostgreSQL hosts two independent schemas in one database:
#   - copilot                (Alembic-owned; application domain persistence)
#   - langgraph_checkpoint   (LangGraph-owned; AsyncPostgresSaver)
# SQLAlchemy/psycopg and the LangGraph checkpointer use separate connections/pools.

# The image is PostgreSQL 16 WITH the pgvector extension binaries, on a pinned
# major tag rather than `latest`. Knowledge retrieval's vector channel is a
# pgvector `vector` column and an exact cosine scan, so a fresh clone that runs
# the plain `postgres:16` image fails at the first migration with
# `type "vector" does not exist` -- the extension cannot be created from an image
# that does not ship it. pgvector/pgvector:pg16 is upstream PostgreSQL 16 with the
# extension added, so it is the same server the previous image ran.
#
# Shipping the binary is NOT the same as having the extension: the first
# `alembic upgrade head` still issues `CREATE EXTENSION IF NOT EXISTS vector`,
# because an extension is created per DATABASE, not per image. See
# docs/p3/p3-a-operations.md for the safe upgrade of an existing volume.
#
# The mounted init script creates the `copilot` SCHEMA (the namespace, not any
# table). Every connection pins `search_path=copilot`, so without it a fresh
# clone's first `alembic upgrade head` fails before running a migration at all:
# `InvalidSchemaName: no schema has been selected to create in` while creating
# `alembic_version`. The entrypoint only runs this for an EMPTY data directory,
# so it affects fresh volumes and nothing else.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: copilot-postgres
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      # Local-dev contract: 5433 is Copilot's PostgreSQL. 5432 is reserved for
      # HISIEM's own siem-postgres (they must not collide on one host).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - copilot_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  copilot_pgdata:
